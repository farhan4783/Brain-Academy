model_list:
  # Tier 1: Fast/Small Model (Speculative / Bash / Routine File Ops)
  - model_name: tier1-fast
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 100
      tpm: 100000

  - model_name: tier1-fast-fallback
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  # Tier 2: Deep Reasoning Models (Bug Diagnosis, Complex Refactoring)
  - model_name: tier2-reasoning
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 60
      tpm: 80000

  - model_name: tier2-deep-reasoning
    litellm_params:
      model: deepseek/deepseek-r1
      api_key: os.environ/DEEPSEEK_API_KEY

router_settings:
  routing_strategy: usage-based-routing
  fallbacks:
    - tier1-fast: ["tier1-fast-fallback"]
    - tier2-reasoning: ["tier2-deep-reasoning"]

general_settings:
  database_url: os.environ/DATABASE_URL
  master_key: sk-hermes-master-proxy-key

