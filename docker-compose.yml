version: "3.8"

services:
  # ========================================================
  # Temporal Server & Web UI (Durable Execution Engine)
  # ========================================================
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: hermes-temporal
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=hermes_user
      - POSTGRES_PWD=hermes_password
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233" # gRPC
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hermes-network

  temporal-ui:
    image: temporalio/ui:2.30.0
    container_name: hermes-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8233:8080" # Temporal Dashboard
    depends_on:
      - temporal
    networks:
      - hermes-network

  # ========================================================
  # Primary Relational Store: PostgreSQL
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: hermes-postgres
    environment:
      - POSTGRES_USER=hermes_user
      - POSTGRES_PASSWORD=hermes_password
      - POSTGRES_DB=hermes_clawdbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes_user -d hermes_clawdbot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hermes-network

  # ========================================================
  # Vector Database: Qdrant (Semantic Code & Memory Search)
  # ========================================================
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: hermes-qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - hermes-network

  # ========================================================
  # LLM Gateway: LiteLLM Proxy
  # ========================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: hermes-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    environment:
      - DATABASE_URL=postgresql://hermes_user:hermes_password@postgres:5432/hermes_clawdbot
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hermes-network

volumes:
  pgdata:
  qdrant_storage:

networks:
  hermes-network:
    driver: bridge
